<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":null,"default":"excellent"},"$preview":{"width":1456,"height":819}}'>
class Component extends DCLogic {
  renderVals() {
    const MOODS = {
      excellent: { accent: '#7A8B2E', badgeBg: '#7A8B2E', badgeInk: '#FBF1D6', label: 'Score excellent', series: 'La gloire de Madame', quote: '« Éléonore a tout frotté. Même le passé de Gérard. »', tag: 'Plus blanc que blanc !', next: 'Le notaire arrive avec un chiffon.', soap: [740, 168, 14], crate: null },
      bon: { accent: '#C8561B', badgeBg: '#C8561B', badgeInk: '#FBF1D6', label: 'Bon score', series: 'Les secrets de l’évier', quote: '« Propre, chéri. Presque trop propre. Qu’est-ce que tu caches ? »', tag: 'Ça brille, mais il reste une trace !', next: 'La facture du pressing.', soap: [730, 172, 12], crate: null },
      moyen: { accent: '#7a4a22', badgeBg: '#7a4a22', badgeInk: '#FBF1D6', label: 'Score moyen', series: 'Passions mal rincées', quote: '« Il a frotté à moitié. Elle a pardonné à moitié. »', tag: 'À moitié propre, à moitié pardonné !', next: 'Philippe cache-t-il un second tablier ?', soap: [770, 176, 14], crate: null },
      mauvais: { accent: '#3f7f8a', badgeBg: '#3f7f8a', badgeInk: '#FBF1D6', label: 'Mauvais score', series: 'Larmes et lessive', quote: '« Tu as fait tomber le savon, et notre mariage avec. »', tag: 'Une tache qui ne part pas à 30 degrés !', next: 'La tache partira-t-elle un jour ?', soap: [1010, 262, 24], crate: [560, 176, -26] },
      catastrophe: { accent: '#B5361F', badgeBg: '#E3A72F', badgeInk: '#3e2412', label: 'Score catastrophique', series: 'Le grand désastre domestique', quote: '« QUI A OSÉ ? Henriette, tu as toujours jalousé mes rideaux ! »', tag: 'Aucune lessive ne lavera cet affront !', next: 'Une jumelle oubliée et un détachant miracle.', soap: [860, 176, 40], crate: [470, 76, -22] }
    };
    const key = this.props.mood && MOODS[this.props.mood] ? this.props.mood : 'excellent';
    const d = MOODS[key];
    let wave = 'M0 444';
    for (let i = 0; i < 13; i++) wave += ' q 30 -14 60 0 t 60 0';
    const soapStyle = 'position:absolute;left:' + (d.soap[0] - 180) + 'px;top:' + (d.soap[1] - 165) + 'px;width:360px;height:330px;transform:rotate(' + d.soap[2] + 'deg) scale(0.72)';
    const crateStyle = d.crate ? 'position:absolute;left:' + (d.crate[0] - 180) + 'px;top:' + (d.crate[1] - 75) + 'px;width:360px;height:150px;transform:rotate(' + d.crate[2] + 'deg) scale(0.62)' : '';
    return {
      wavePath: wave,
      m: {
        accent: d.accent,
        badgeBg: d.badgeBg,
        badgeInk: d.badgeInk,
        label: d.label,
        series: d.series,
        quote: d.quote,
        tag: d.tag,
        next: d.next,
        soapStyle,
        crateStyle,
        crateAlone: !!d.crate,
        crateOnSoap: !d.crate,
        isExcellent: key === 'excellent',
        isBon: key === 'bon',
        isMoyen: key === 'moyen',
        isMauvais: key === 'mauvais',
        isCata: key === 'catastrophe'
      }
    };
  }
}
</script>
